<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <div class="title">Registration</div>
        <form action="#">
            <div class="user-detail">
                <div class="input-box">
                    <span class="detail">Full Name</span>
                    <input type="text" placeholder="Enter your name" required>

                </div>
                <div class="input-box">
                    <span class="detail">Username</span>
                    <input type="text" placeholder="Enter username">
                </div>
                <div class="input-box">
                    <span  class="detail">Email</span>
                    <input type="text" placeholder="Enter Email">
                </div>
                <div class="input-box">
                    <span class="detail">Phone Number</span>
                    <input type="numbers"placeholder="Enter Phone NuMmber">
                </div>
                <div class="input-box">
                    <span class="detail">Password</span>
                    <input type="password"placeholder="Enter Password">
                </div>
                <div class="input-box">
                    <span class="detail">Confirm Password</span>
                    <input type="password" placeholder="Confirm Password">

                </div>
                <div class="gender-detail">
                   
    <span class="gender-title">Gender</span>

    <div class="category">
        <label>
            <input type="radio" name="gender">
            <span>Male</span>
        </label>

        <label>
            <input type="radio" name="gender">
            <span>Female</span>
        </label>

        <label>
            <input type="radio" name="gender">
            <span>Prefer not to say</span>
        </label>
    </div>
</div>
                <div class="button">
                    <input type="submit" value="register">
                </div>
            </div>
        </form>
    
    </div>








    
</body>
</html>
